<!doctype html>
<html lang="sv" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Image generation galleri</title>
<style>
  :root {
    --background: #ffffff; --foreground: #0a0a0a; --card: #ffffff; --muted: #f5f5f5;
    --muted-foreground: #737373; --border: #e5e5e5; --ring: #a3a3a3;
    --primary: #171717; --primary-foreground: #fafafa; --accent: #eab308; --radius: 12px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --background: #0a0a0a; --foreground: #fafafa; --card: #141414; --muted: #1f1f1f;
    --muted-foreground: #a3a3a3; --border: #262626; --ring: #525252;
    --primary: #fafafa; --primary-foreground: #171717;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: background-color .2s, color .2s; }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted-foreground); }
  a { color: inherit; }
  .toolbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
    margin: 24px 0; padding: 12px 14px; background: color-mix(in srgb, var(--background) 85%, transparent);
    backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: var(--radius); }
  .ctl { display: flex; align-items: center; gap: 8px; color: var(--muted-foreground); font-size: 13px; }
  .ctl output { color: var(--foreground); min-width: 2.5em; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 96px; accent-color: var(--primary); }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card);
    color: var(--foreground); font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--muted); }
  .btn:focus-visible, .star:focus-visible, .file:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }
  .btn[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  .file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg .btn { border: 0; border-radius: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { position: relative; cursor: pointer; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card); padding: 24px 16px 16px; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, box-shadow .15s; }
  .card:hover { border-color: var(--ring); }
  .card[aria-selected="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .stage { display: flex; justify-content: center; }
  .name { font-weight: 600; display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .name code { font-weight: 400; font-size: 12px; color: var(--muted-foreground); }
  .desc { color: var(--muted-foreground); font-size: 13px; margin: 0; }
  .actions { display: flex; gap: 8px; }
  .star { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 8px; border: 0; background: none;
    cursor: pointer; color: var(--muted-foreground); font-size: 18px; line-height: 1; z-index: 2; }
  .star:hover { background: var(--muted); }
  .star[aria-pressed="true"] { color: var(--accent); }
  .favs { margin-top: 12px; color: var(--muted-foreground); font-size: 13px; }
  .detail { margin-top: 24px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 20px; }
  .code-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: var(--muted-foreground); font-size: 12px; }
  pre { margin: 0; padding: 14px; border-radius: 10px; background: var(--muted); overflow-x: auto; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  footer { margin-top: 40px; color: var(--muted-foreground); font-size: 12px; }
  @media (max-width: 640px) { input[type=range] { width: 72px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="gallery.js"></script>
</body>
</html>
